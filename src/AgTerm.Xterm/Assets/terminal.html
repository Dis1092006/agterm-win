<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'"
    />
    <title>agterm terminal</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c0c0c;
        overflow: hidden;
      }
      #panes {
        height: 100%;
        width: 100%;
      }
      /* above a pane question's layer, under a session-wide one */
      #search-bar {
        position: absolute;
        top: 8px;
        right: 10px;
        z-index: 70;
        display: flex;
        align-items: center;
        gap: 4px;
        width: min(360px, calc(100% - 16px));
        min-width: 0;
        height: 34px;
        padding: 0 5px 0 9px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 6px;
        background: rgba(31, 31, 31, 0.96);
        color: #f3f3f3;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        font:
          13px "Segoe UI Variable Text",
          "Segoe UI",
          sans-serif;
      }
      #search-bar[hidden] {
        display: none;
      }
      #search-input {
        flex: 1 1 auto;
        min-width: 120px;
        border: 0;
        outline: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      #search-input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }
      #search-status {
        min-width: 64px;
        color: rgba(255, 255, 255, 0.72);
        text-align: right;
        white-space: nowrap;
      }
      .search-button {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font:
          16px "Segoe UI Symbol",
          sans-serif;
        line-height: 26px;
        cursor: pointer;
      }
      .search-button:hover,
      .search-button:focus-visible {
        background: rgba(255, 255, 255, 0.12);
        outline: none;
      }
      .pane {
        position: relative;
        height: 100%;
        width: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .split-divider {
        width: 4px;
        height: 100%;
        cursor: col-resize;
        background: rgba(255, 255, 255, 0.15);
        touch-action: none;
        user-select: none;
        min-width: 4px;
        min-height: 0;
      }
      .split-divider:focus {
        outline: 1px solid rgba(255, 255, 255, 0.65);
        outline-offset: -1px;
      }
      #panes.dashboard-layout {
        display: grid;
        gap: 4px;
        padding: 4px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.12);
      }
      .dashboard-cell {
        outline: 1px solid rgba(255, 255, 255, 0.16);
        outline-offset: -1px;
      }
      .dashboard-cell.dashboard-highlighted {
        outline: 2px solid #60cdff;
        outline-offset: -2px;
      }
      /* a full-size overlay hides the base pane, but a question on that pane still shows above it */
      .ask-layer {
        position: absolute;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.2);
        outline: none;
        visibility: visible;
        pointer-events: auto;
      }
      .ask-layer.ask-session {
        position: fixed;
        z-index: 80;
      }
      .ask-panel {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: max-content;
        overflow: auto;
        border: 1px solid;
      }
      .ask-title {
        font-weight: bold;
        overflow-wrap: anywhere;
      }
      .ask-message {
        overflow-wrap: anywhere;
      }
      .ask-buttons-row {
        display: flex;
        min-width: 0;
      }
      .ask-buttons {
        display: inline-grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        max-width: 100%;
      }
      .ask-buttons.ask-column {
        grid-auto-flow: row;
        grid-template-columns: minmax(0, max-content);
      }
      .ask-button {
        border: 0;
        font: inherit;
        white-space: nowrap;
        cursor: pointer;
      }
      .ask-buttons.ask-column .ask-button {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .ask-button.ask-destructive {
        font-weight: bold;
      }
      /* xterm's own padding is 0; keep a hairline inset so glyphs don't touch the window edge */
      .xterm {
        padding: 2px;
      }
    </style>
  </head>
  <body>
    <div id="panes"></div>
    <div id="search-bar" role="search" hidden>
      <input
        id="search-input"
        type="text"
        placeholder="Find"
        aria-label="Find"
        autocomplete="off"
        spellcheck="false"
      />
      <span id="search-status" aria-live="polite"></span>
      <button
        id="search-previous"
        class="search-button"
        type="button"
        aria-label="Previous match"
      >
        &#x2191;
      </button>
      <button
        id="search-next"
        class="search-button"
        type="button"
        aria-label="Next match"
      >
        &#x2193;
      </button>
      <button
        id="search-close"
        class="search-button"
        type="button"
        aria-label="Close search"
      >
        &#x00D7;
      </button>
    </div>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script src="vendor/addon-search.js"></script>
    <script src="vendor/addon-serialize.js"></script>
    <script src="bridge.js"></script>
  </body>
</html>
